 var hr=new THREE.Mesh(new THREE.SphereGeometry(.32,14,10,0,Math.PI*2,0,Math.PI*.5),mat(hair,{flatShading:false}));hr.position.y=1.95;g.add(hr);
 var ring=new THREE.Mesh(new THREE.TorusGeometry(.45,.025,6,24),new THREE.MeshBasicMaterial({color:col}));ring.rotation.x=Math.PI/2;ring.position.y=.03;g.add(ring);
 g.userData.ring=ring;g.userData.body=body;
 return g;
}
var people=[];
var labelsEl=document.getElementById('labels');
function mkLabel(name,sub){var d=document.createElement('div');d.className='lb';d.innerHTML='<b></b><small></small>';labelsEl.appendChild(d);return d;}
var ALI={g:person(0xffffff,0xc99066,0x151515),home:ceoPos.clone(),id:'ali'};
ALI.g.position.copy(ceoPos);ALI.g.rotation.y=Math.PI;scene.add(ALI.g);ALI.g.userData.ref=ALI;
ALI.lab=mkLabel();ALI.bub=null;
AGENTS.forEach(function(a,i){
 a.g=person(a.col,a.skin,a.hair);a.home=new THREE.Vector3(a.pos[0],0,a.pos[1]);a.g.position.copy(a.home);a.g.userData.ref=a;scene.add(a.g);
 a.lab=mkLabel();a.bub=document.createElement('div');a.bub.className='bub';labelsEl.appendChild(a.bub);
 a.target=a.home.clone();a.ph=Math.random()*6;a.ti=0;
 /* meeting seat */
 var ang=Math.PI*(.15+i*.7/5)+Math.PI*.0;var an=(i/6)*Math.PI*2+Math.PI/2;
 a.seat=new THREE.Vector3(MR.x+Math.cos(an)*2.5,0,MR.z+Math.sin(an)*2.5);
});
function setLabels(){
 var U=UI[lang];
 AGENTS.forEach(function(a){var L=a[lang];a.lab.querySelector('b').textContent=L.n;a.lab.querySelector('small').textContent=L.r;});

/* ---------- CAMERA ---------- */
var cam={yaw:.0,pitch:.5,dist:30,tx:0,ty:1.5,tz:0};
var camT={yaw:.0,pitch:.5,dist:30,tx:0,ty:1.5,tz:0};
function applyCam(k){
 ['yaw','pitch','dist','tx','ty','tz'].forEach(function(p){cam[p]+=(camT[p]-cam[p])*k;});
 var cp=Math.cos(cam.pitch);
 camera.position.set(cam.tx+Math.sin(cam.yaw)*cp*cam.dist,cam.ty+Math.sin(cam.pitch)*cam.dist,cam.tz+Math.cos(cam.yaw)*cp*cam.dist);
 camera.lookAt(cam.tx,cam.ty,cam.tz);
}
var mode='view';
function homeCam(){var w=innerWidth/innerHeight;camT.yaw=0;camT.pitch=.5;camT.dist=w<.8?40:32;camT.tx=w<.8?-2:1;camT.ty=1.5;camT.tz=0;}
function planCam(){var w=innerWidth/innerHeight;camT.yaw=0;camT.pitch=1.5;camT.dist=w<.8?42:34;camT.tx=w<.8?-2:1;camT.ty=0;camT.tz=0;}
homeCam();cam.yaw=-.5;cam.pitch=.7;cam.dist=60;

/* input */
var drag=null,pinch=null;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,id:e.pointerId,m:0};pointers[e.pointerId]=e;hideHint();});
var pointers={};
cv.addEventListener('pointermove',function(e){
 pointers[e.pointerId]=e;
 var ids=Object.keys(pointers);
 if(ids.length===2){var a=pointers[ids[0]],b=pointers[ids[1]];var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch){camT.dist=clamp(camT.dist*(pinch/d),12,95);}pinch=d;if(drag)drag.m=99;return;}
 if(!drag)return;
 var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.m+=Math.abs(dx)+Math.abs(dy);
 if(mode==='plan'){camT.tx=clamp(camT.tx-dx*camT.dist*.0022,-12,12);return;}
 camT.yaw-=dx*.006;camT.pitch=clamp(camT.pitch+dy*.005,.15,1.2);
});
function up(e){delete pointers[e.pointerId];pinch=null;
 if(drag&&drag.m<8&&Object.keys(pointers).length===0)pick(e.clientX,e.clientY);
 drag=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(e){delete pointers[e.pointerId];pinch=null;drag=null;});
cv.addEventListener('wheel',function(e){e.preventDefault();camT.dist=clamp(camT.dist+e.deltaY*.03,12,95);},{passive:false});
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
var hintEl=document.getElementById('hint');function hideHint(){hintEl.style.opacity=0;}
setTimeout(hideHint,6000);

/* pick */
var ray=new THREE.Raycaster(),m2=new THREE.Vector2();
var selected=null;
function pick(x,y){
 m2.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(m2,camera);
 var objs=[];AGENTS.concat([ALI]).forEach(function(a){a.g.traverse(function(o){if(o.isMesh){o.userData.owner=a;objs.push(o);}});});
 var hit=ray.intersectObjects(objs,false)[0];
 if(hit)select(hit.object.userData.owner);else closePanel();
}
function select(a){
 selected=a;var U=UI[lang];var h='';
 if(a.id==='ali'){h='<h2>'+(lang==='en'?'Ali':'علي')+'</h2><div class="role">'+U.ali+'</div><p>'+U.alid+'</p>';}
 else{var L=a[lang];h='<h2>'+L.n+'</h2><div class="role">'+L.r+'</div><p>'+L.d+'</p><h3>'+U.now+'</h3><ul>'+L.t.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul><h3>'+U.skills+'</h3><div class="chips">'+L.sk.map(function(s){return '<span>'+s+'</span>';}).join('')+'</div>';}
 document.getElementById('pc').innerHTML=h;if(LIVE[a.id])mountTasks(a);document.getElementById('panel').classList.add('open');
 if(mode!=='meet'&&mode!=='plan'){camT.tx=a.g.position.x;camT.tz=a.g.position.z+1;camT.dist=17;camT.pitch=.35;camT.yaw=0;}
 AGENTS.concat([ALI]).forEach(function(o){o.lab.classList.toggle('sel',o===a);});
}

/* ---------- LIVE TASKS (Kareem, Baha) ---------- */
var WORKER_URL='https://fxd-office.ali-darwish-lb.workers.dev';
var LIVE={
 laila:{en:['Outline module 3 for the 9-seat cohort','Launch checklist for registration opening','Draft an FAQ for prospects'],ar:['مخطط المحور 3 لدفعة الـ 9 مقاعد','قائمة تجهيز لفتح التسجيل','صياغة أسئلة شائعة للمهتمين']},
 noor:{en:['Template: pre-NY-session brief','10 topic ideas my audience will care about','Questions traders ask about liquidity'],ar:['قالب: ملخص ما قبل جلسة نيويورك','10 أفكار مواضيع تهم جمهوري','أسئلة يسألها المتداولون عن السيولة']},
 ramy:{en:['Organise my task list (paste it here)','Weekly review template','What should I prioritise this week?'],ar:['رتّب قائمة مهامي (الصقها هنا)','قالب مراجعة أسبوعية','ما الأولويات هذا الأسبوع؟']},
 sara:{en:['Edit plan for a 30s Reel (paste transcript)','Caption timing for an Arabic and English Reel','Export checklist for Instagram Reels'],ar:['خطة مونتاج لريل 30 ثانية (الصق النص)','توقيت كابشن عربي وإنجليزي','قائمة تصدير لريلز انستغرام']},

 kareem:{en:['Reel script: liquidity sweep in 30s','Carousel: 3 mistakes after a CHoCH','Captions for last live session'],ar:['سكريبت ريل: الـ liquidity sweep في 30 ثانية','كاروسيل: 3 أخطاء بعد الـ CHoCH','كابشن لآخر جلسة لايف']},
 baha:{en:['Reply: price of the course?','Reply: when does registration open?','Reply: can I join the free community?'],ar:['رد: كم سعر الكورس؟','رد: متى يفتح التسجيل؟','رد: هل أقدر أنضم للمجتمع المجاني؟']}
};
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function hist(id){try{return JSON.parse(lsGet('fxd_hist_'+id)||'[]');}catch(e){return [];}}
function mountTasks(a){
 var ar=lang==='ar',pc=document.getElementById('pc');
 var d=document.createElement('div');d.className='tk';
 d.innerHTML='<h3 style="margin-top:0">'+(ar?'أعطِ مهمة':'Give a task')+'</h3>'+
  '<div class="row">'+LIVE[a.id][lang].map(function(q,i){return '<button class="q" data-i="'+i+'">'+esc(q)+'</button>';}).join('')+'</div>'+
  '<textarea id="tkIn" placeholder="'+(ar?'اكتب المهمة هنا…':'Type the task here…')+'"></textarea>'+
  '<div class="row"><button class="go" id="tkGo">'+(ar?'أرسل للوكيل':'Send to '+a.en.n)+'</button></div>'+
  '<div class="err" id="tkErr"></div><div id="tkRes"></div>';
 pc.appendChild(d);
 var inp=d.querySelector('#tkIn'),err=d.querySelector('#tkErr'),res=d.querySelector('#tkRes'),go=d.querySelector('#tkGo');
 d.querySelectorAll('.q').forEach(function(b){b.onclick=function(){inp.value=LIVE[a.id][lang][+b.dataset.i];};});
 function draw(){res.innerHTML='';hist(a.id).forEach(function(h,i){var r=document.createElement('div');r.className='res';r.innerHTML='<small>'+esc(h.ts)+' · '+esc(h.t.slice(0,60))+'</small><pre>'+esc(h.r)+'</pre><div class="row"><button class="q">'+(ar?'نسخ':'Copy')+'</button></div>';
  r.querySelector('button').onclick=function(){try{navigator.clipboard.writeText(h.r);this.textContent=ar?'تم':'Copied';}catch(e){this.textContent='—';}};res.appendChild(r);});}
 draw();
 go.onclick=function(){
  var task=inp.value.trim();if(!task)return;
  var pin=lsGet('fxd_pin');
  if(!pin){err.innerHTML='';var box=document.getElementById('pinBox');if(!box){box=document.createElement('input');box.id='pinBox';box.type='password';box.placeholder=ar?'أدخل الرمز السري':'Enter your office PIN';box.style.marginTop='8px';go.parentNode.parentNode.insertBefore(box,go.parentNode);box.focus();return;}
   pin=box.value.trim();if(!pin)return;lsSet('fxd_pin',pin);}
  go.disabled=true;go.textContent=ar?'يعمل…':'Working…';err.textContent='';
  a.bub.textContent=ar?'أشتغل على المهمة…':'Working on it…';a.bub.classList.add('on');
  fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Office-Pin':pin},body:JSON.stringify({agent:a.id,task:task})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j,s:r.status};});})
  .then(function(o){
   if(o.ok&&o.j.result){var h=hist(a.id);h.unshift({t:task,r:o.j.result,ts:new Date().toLocaleString()});lsSet('fxd_hist_'+a.id,JSON.stringify(h.slice(0,10)));draw();a.bub.textContent=ar?'خلصت. النتيجة في اللوحة.':'Done. Result is in the panel.';}
   else{if(o.s===401){try{localStorage.removeItem('fxd_pin');}catch(e){}err.textContent=ar?'الرمز السري غير صحيح.':'Wrong PIN. Try again.';}
    else err.textContent=(ar?'تعذر التنفيذ: ':'Could not run the task: ')+(o.j&&(o.j.detail||o.j.error)||o.s);a.bub.classList.remove('on');}
  }).catch(function(){err.textContent=ar?'تعذر الوصول للخادم. هل تم نشر الـ Worker؟':'Could not reach the server. Is the Worker deployed?';a.bub.classList.remove('on');})
  .then(function(){go.disabled=false;go.textContent=ar?'أرسل للوكيل':'Send to '+a.en.n;setTimeout(function(){a.bub.classList.remove('on');},4000);});
 };
}
function closePanel(){selected=null;document.getElementById('panel').classList.remove('open');AGENTS.concat([ALI]).forEach(function(o){o.lab.classList.remove('sel');});if(mode==='view')homeCam();}
document.getElementById('px').onclick=closePanel;

/* buttons */
var bV=document.getElementById('bView'),bP=document.getElementById('bPlan'),bM=document.getElementById('bMeet'),bL=document.getElementById('bLang');
function setBtn(){bV.classList.toggle('on',mode==='view');bP.classList.toggle('on',mode==='plan');bM.classList.toggle('on',mode==='meet');}
bV.onclick=function(){mode='view';leaveMeeting();closePanel();homeCam();setBtn();};
bP.onclick=function(){mode='plan';closePanel();planCam();setBtn();};
bM.onclick=function(){if(mode==='meet'){mode='view';leaveMeeting();homeCam();}else{mode='meet';startMeeting();}setBtn();updText();};
bL.onclick=function(){lang=lang==='en'?'ar':'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('ar',lang==='ar');setLabels();updText();if(selected)select(selected);};
function updText(){var U=UI[lang];document.getElementById('ttl').textContent=U.ttl;document.getElementById('liveTxt').textContent=U.live;bV.textContent=U.v;bP.textContent=U.p;bM.textContent=mode==='meet'?U.mb:U.m;bL.textContent=U.l;hintEl.textContent=U.hint;}

/* meeting */
var meetIdx=-1,meetTimer=null;
function startMeeting(){
 closePanel();
 AGENTS.forEach(function(a){a.target.copy(a.seat);});
 camT.tx=MR.x-1;camT.tz=MR.z+1;camT.ty=1.2;camT.dist=innerWidth/innerHeight<.8?26:24;camT.pitch=.6;camT.yaw=.2;
 meetIdx=-1;clearTimeout(meetTimer);
 meetTimer=setTimeout(function nxt(){meetIdx++;if(mode!=='meet')return;if(meetIdx>=AGENTS.length){meetIdx=-1;meetTimer=setTimeout(nxt,2500);return;}
  AGENTS.forEach(function(a,i){a.bub.classList.toggle('on',i===meetIdx);a.bub.textContent=a[lang].say;});meetTimer=setTimeout(nxt,4200);},2800);
}
function leaveMeeting(){clearTimeout(meetTimer);AGENTS.forEach(function(a){a.target.copy(a.home);a.bub.classList.remove('on');});}

/* idle chatter */
setInterval(function(){if(mode==='meet')return;var a=AGENTS[Math.floor(Math.random()*AGENTS.length)];a.ti=(a.ti+1)%a[lang].t.length;a.bub.textContent=a[lang].t[a.ti];a.bub.classList.add('on');setTimeout(function(){if(mode!=='meet')a.bub.classList.remove('on');},3200);},4500);

/* ---------- LOOP ---------- */
var clock=new THREE.Clock(),v3=new THREE.Vector3();
function project(p,el,dy){v3.copy(p);v3.y+=dy;v3.project(camera);var vis=v3.z<1;el.style.display=vis?'block':'none';el.style.left=((v3.x*.5+.5)*innerWidth)+'px';el.style.top=((-v3.y*.5+.5)*innerHeight)+'px';}
function loop(){
 requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 applyCam(.08);
 AGENTS.forEach(function(a){
  var d=v3.copy(a.target).sub(a.g.position);var len=d.length();
  if(len>.05){d.normalize();a.g.position.addScaledVector(d,Math.min(len,dt*4.2));a.g.rotation.y=Math.atan2(d.x,d.z);a.g.position.y=Math.abs(Math.sin(t*10+a.ph))*.08;}
  else{a.g.position.y=0;var face=(mode==='meet')?Math.atan2(MR.x-a.g.position.x,MR.z-a.g.position.z):0;a.g.rotation.y+=(face-a.g.rotation.y)*.1;a.g.userData.body.scale.y=1+Math.sin(t*2+a.ph)*.015;}
  a.g.userData.ring.material.opacity=1;
  project(a.g.position,a.lab,2.45);
  var bp=v3.copy(a.g.position);project(bp,a.bub,4.3);
  var bw=a.bub.offsetWidth;
  a.bub.style.display=a.bub.classList.contains('on')?a.bub.style.display:'none';
  if(a.bub.classList.contains('on')){a.bub.style.transform='translate(-50%,-100%)';}
 });
 project(ALI.g.position,ALI.lab,2.45);
 renderer.render(scene,camera);
}
setLabels();updText();loop();
})();
